<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
  <style>
    :root { --page: #f4f1e8; --surface: #fffdf7; --surface-sunken: #efeade; --ink: #1b1a17; --ink-2: #3f3c35; --ink-3: #57544c; --accent: #b5341f; --on-color: #fffdf7; --marker: #7d5510; --radius: 2px; --font-serif: "Newsreader", Georgia, serif; --font-sans: "Archivo", system-ui, sans-serif; --font-mono: "IBM Plex Mono", ui-monospace, monospace; }
    body { margin: 0; font-family: var(--font-sans); background: var(--page); color: var(--ink); }
    .status { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.18em; color: var(--ink-3); margin: 0; }
    .serif { font-family: var(--font-serif); font-size: 36px; font-weight: 500; color: var(--ink); margin: 0; line-height: 1.05; }
    .bodyline { font-family: var(--font-mono); font-size: 13px; color: var(--ink-2); margin: 0; line-height: 1.5; }
    .warn { background: var(--surface-sunken); border-left: 3px solid var(--marker); padding: 8px 10px; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.12em; color: var(--marker); }
    .l1 { display: flex; align-items: center; justify-content: center; min-height: 56px; background: var(--accent); border-radius: var(--radius); color: var(--on-color); font-family: var(--font-sans); font-size: 16px; font-weight: 600; }
    .l2 { display: flex; align-items: center; justify-content: center; min-height: 52px; background: var(--surface); border: 1px solid var(--ink); border-radius: var(--radius); color: var(--ink); font-family: var(--font-sans); font-size: 16px; font-weight: 600; }
  </style>
</helmet>
<!-- COPY A — the machine took the program (readback workoutType 1, state
     WAITTOBEGIN). The shipped Ready frame (justrow-ready.png) with ONE line
     changed; the erg beside it shows its Just Row screen, which is the
     walk leg's photograph. -->
<div style="width: 393px; height: 852px; background: var(--page); box-sizing: border-box; padding: 20px; display: flex; flex-direction: column;">
  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px;">
    <p class="status">PM5 432331249 &middot; CONNECTED</p>
    <p class="serif">Ready when you pull</p>
    <p class="bodyline">The clock starts on your first stroke.</p>
    <div class="warn">KEEP YOUR PHONE SCREEN ON</div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 12px;"><div class="l1">Show me the numbers</div><div class="l2">Cancel</div></div>
</div>
</x-dc>
</body>
</html>
