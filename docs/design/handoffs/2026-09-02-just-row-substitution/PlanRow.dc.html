<!doctype html>

<head>

<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
  <style>
    :root { --page: #f4f1e8; --surface: #fffdf7; --surface-sunken: #efeade; --ink: #1b1a17; --ink-2: #3f3c35; --ink-3: #57544c; --ink-4: #6f6a5f; --rule: #d8d3c4; --rule-3: #c9c3b2; --accent: #b5341f; --on-color: #fffdf7; --type-o2: #2a6275; --type-at: #8a5f18; --type-an: #5c4382; --type-tr: #1b1a17; --radius: 2px; --font-serif: "Newsreader", Georgia, serif; --font-sans: "Archivo", system-ui, sans-serif; --font-mono: "IBM Plex Mono", ui-monospace, monospace; }
    body { margin: 0; font-family: var(--font-sans); background: var(--page); color: var(--ink); }
    .h1 { font-family: var(--font-serif); font-size: 34px; font-weight: 500; margin: 0; letter-spacing: -0.01em; line-height: 1.08; }
    .meta { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em; color: var(--ink-3); margin: 0; }
    .seclabel { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.16em; color: var(--ink-3); margin: 0; }
    .card { background: var(--surface); border: 1px solid var(--ink); border-radius: var(--radius); padding: 16px; }
    .numlabel { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; color: var(--ink-3); margin: 0 0 4px; }
    .numvalue { font-family: var(--font-mono); font-size: 26px; color: var(--ink); margin: 0; letter-spacing: -0.01em; }
    .pain { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
    .paincell { display: flex; align-items: center; justify-content: center; min-height: 44px; background: var(--surface-sunken); border: 1px solid var(--rule-3); border-radius: var(--radius); font-family: var(--font-sans); font-size: 15px; color: var(--ink-2); }
    .notes { min-height: 84px; background: var(--surface); border: 1px dashed var(--rule-3); border-radius: var(--radius); padding: 12px; font-family: var(--font-mono); font-size: 14px; color: var(--ink-4); }
    /* index.css .summary-save-lead / .summary-save-secondary, verbatim values */
    .lead { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 54px; background: var(--accent); color: var(--on-color); border: none; border-radius: var(--radius); font-family: var(--font-sans); font-size: 16px; font-weight: 600; }
    .secondary { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 48px; background: var(--surface); color: var(--ink); border: 1px solid var(--ink); border-radius: var(--radius); font-family: var(--font-sans); font-size: 16px; font-weight: 600; box-sizing: border-box; }
    .discard { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em; color: var(--ink-2); text-align: center; }
    .tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; border-top: 1px solid var(--rule); background: var(--page); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; }
    .tab { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; color: var(--ink-3); text-align: center; } .tab-on { color: var(--ink); }
    /* Plan tab, from plan-linked.png + index.css .plan-row-* */
    .plan-h { display: flex; justify-content: space-between; align-items: center; }
    .plan-title { font-family: var(--font-serif); font-size: 22px; font-weight: 500; margin: 0; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 14px; background: var(--surface); border: 1px solid var(--ink); border-radius: var(--radius); font-family: var(--font-sans); font-size: 15px; color: var(--ink); }
    .row { display: grid; grid-template-columns: 34px 30px 1fr 24px; align-items: center; column-gap: 12px; min-height: 44px; border-bottom: 1px solid var(--rule); padding: 0 8px 0 0; }
    .row-today { background: var(--surface-sunken); border-left: 3px solid var(--accent); }
    .num { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); text-align: right; }
    .badge { display: inline-flex; justify-self: center; min-width: 30px; box-sizing: border-box; align-items: center; justify-content: center; padding: 3px 7px; border-radius: 2px; font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: var(--on-color); }
    .jr { display: inline-flex; align-items: center; justify-content: center; justify-self: center; min-width: 30px; box-sizing: border-box; padding: 2px 6px; border-radius: 2px; border: 1px solid var(--rule-3); background: transparent; font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: 0.06em; color: var(--ink-3); }
    .name { font-family: var(--font-sans); font-size: 14px; color: var(--ink); }
    .swap { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; color: var(--ink-3); grid-column: 3; grid-row: 2; margin-top: -4px; padding-bottom: 8px; }
    .row-two { grid-template-rows: auto auto; padding-top: 6px; }
    .row-two .num, .row-two .badge, .row-two .jr, .row-two .check { grid-row: 1 / span 2; align-self: center; }
    .row-two .name { grid-row: 1; align-self: end; padding-top: 6px; }
    .check { color: var(--accent); font-size: 16px; text-align: center; }
    .play { color: var(--accent); font-size: 14px; text-align: center; }
  </style>
</helmet>
