<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
  <style>
    :root {
      --page: #f4f1e8; --surface: #fffdf7; --surface-sunken: #efeade;
      --ink: #1b1a17; --ink-2: #3f3c35; --ink-3: #57544c; --ink-4: #6f6a5f;
      --rule: #d8d3c4; --rule-3: #c9c3b2; --accent: #b5341f;
      --type-o2: #2a6275; --on-color: #fffdf7;
      --radius: 2px; --tap: 44px;
      --font-serif: "Newsreader", Georgia, serif;
      --font-sans: "Archivo", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    body { margin: 0; font-family: var(--font-sans); background: var(--page); color: var(--ink); }
    a { color: var(--accent); } a:hover { color: #9c2c19; }
    .screen { width: 390px; height: 844px; background: var(--page); position: relative; overflow: hidden; box-sizing: border-box; }
    .pad { padding: 0 20px; }
    .h1 { font-family: var(--font-serif); font-size: 34px; font-weight: 500; margin: 0; letter-spacing: -0.01em; }
    .meta { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em; color: var(--ink-3); margin: 0; }
    .seclabel { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.16em; color: var(--ink-3); margin: 0; }
    .card { background: var(--surface); border: 1px solid var(--ink); border-radius: var(--radius); }
    .badge { display: inline-flex; align-items: center; justify-content: center; padding: 3px 7px; background: var(--type-o2); color: var(--on-color); font-family: var(--font-mono); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; }
    .tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; border-top: 1px solid var(--rule); background: var(--page); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; }
    .tab { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; color: var(--ink-3); text-align: center; }
    .tab-on { color: var(--ink); }
    /* Shipped chrome, unchanged: .today-unlogged-line — sunken, --rule
       border, 52px min, 8px 12px padding, 13px ink-3 text. */
    .unlogged { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; background: var(--surface-sunken); border: 1px solid var(--rule); border-radius: var(--radius); padding: 8px 12px; }
    .unlogged-text { font-family: var(--font-sans); font-size: 13px; color: var(--ink-3); margin: 0; }
    .unlogged-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    /* .today-unlogged-link — L2 geometry as an inline pill, 44px. */
    .logit { display: inline-flex; align-items: center; justify-content: center; min-height: var(--tap); min-width: var(--tap); padding: 0 12px; background: var(--surface); border: 1px solid var(--ink); border-radius: var(--radius); color: var(--ink); font-family: var(--font-sans); font-size: 14px; font-weight: 600; }
    .discard { display: inline-flex; align-items: center; justify-content: center; width: var(--tap); height: var(--tap); background: transparent; border: 1px solid var(--accent); border-radius: var(--radius); color: var(--accent); font-size: 16px; line-height: 1; }
    .justrow-btn { display: inline-flex; align-items: center; justify-content: center; min-height: var(--tap); padding: 0 14px; border: 1px solid var(--ink); border-radius: var(--radius); background: var(--surface); font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.14em; color: var(--ink); font-weight: 600; }
  </style>
</helmet>

<div class="screen">
  <div class="pad" style="padding-top: 26px; display: flex; flex-direction: column; gap: 14px;">

    <!-- No plan, no baseline: the door is present regardless (ruling 4 —
         "always visible"). This is the same header the shipped
         today-unlogged.png capture carries. -->
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <h1 class="h1">Today</h1>
      <span class="justrow-btn">JUST ROW</span>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <p class="meta">FREESTYLE</p>
      <span style="font-family: var(--font-sans); font-size: 13px; font-weight: 600; color: var(--accent);">choose a plan &rarr;</span>
    </div>

    <!-- THE RECOVERY ROW for a workout-less run. Two things are deliberate:
         the numbers are ON the row, so "Log it" visibly means "keep these";
         and no word here suggests the row can be picked back up, because
         the monitor stops advertising while a Just Row is open and the app
         cannot get back in (capture finding N1). -->
    <div class="unlogged">
      <p class="unlogged-text"><strong>Just Row</strong>: 6:33 &middot; 1,396 m, not logged.</p>
      <div class="unlogged-actions">
        <span class="logit">Log it</span>
        <span class="discard">&#10005;</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <p class="seclabel">SUGGESTED</p>
    </div>

    <div class="card">
      <div style="padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 6px;">
        <div style="display: flex; align-items: flex-start; justify-content: space-between;">
          <span class="badge">O2</span>
          <span style="font-family: var(--font-mono); font-size: 17px; color: var(--accent);">10&#8242;</span>
        </div>
        <p style="font-family: var(--font-serif); font-size: 26px; font-weight: 500; margin: 2px 0 0;">Sea Fret</p>
        <p style="font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; color: var(--ink-3); margin: 0;">EASY &middot; PAIN 1/5</p>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--rule);">
        <span style="font-family: var(--font-sans); font-size: 14px; color: var(--ink-2);">Least recently done (never done).</span>
        <span style="font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.12em; color: var(--accent);">OPEN &rsaquo;</span>
      </div>
    </div>

    <p class="seclabel" style="color: var(--accent); margin-top: 2px;">ALL SESSIONS</p>
    <p style="font-family: var(--font-sans); font-size: 14px; color: var(--ink-2); margin: 0;">No sessions logged yet.</p>
  </div>

  <div class="tabbar">
    <span class="tab tab-on">TODAY</span>
    <span class="tab">NEWS</span>
    <span class="tab">LIBRARY</span>
    <span class="tab">PLAN</span>
    <span class="tab">YOU</span>
  </div>
</div>
</x-dc>
</body>
</html>
