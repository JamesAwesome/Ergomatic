name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  root-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      # Phase 7B Task 8: `pnpm build`'s own dist/client must never contain
      # this repo's dev-only monitor tooling (fake.ts's simulator, the
      # pm5-lab/pm5-bridge dev harness) — see scripts/dist-grep.sh's own
      # header for the full reasoning and why its needles are string
      # literals rather than identifiers a minifier could rename away.
      - run: pnpm dist:grep

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build api image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          target: api
          push: false
          build-args: |
            APP_VERSION=ci
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          target: web
          push: false

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Install Playwright + Chromium (with OS deps)
        working-directory: app
        run: pnpm exec playwright install --with-deps chromium
      - name: Boot the compose stack (e2e override arms the test-signin backdoor)
        run: |
          POSTGRES_PASSWORD=devpass TEST_AUTH_SECRET=e2e-secret APP_VERSION=e2e \
            docker compose -f compose.yml -f compose.e2e.yml up -d --build --wait --wait-timeout 120
      - name: Run Playwright (flows + design)
        working-directory: app
        run: pnpm exec playwright test --project=chromium
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 14

  deploy-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint + test the deploy script
        run: |
          bash -n scripts/deploy.sh
          bash scripts/deploy.test.sh

  deploy:
    needs: [root-hooks, app, docker, e2e, deploy-script]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment: production
    permissions:
      contents: read
    timeout-minutes: 20
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          SHA: ${{ github.sha }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          umask 077
          KEY="$(mktemp)"; KH="$(mktemp)"
          trap 'rm -f "$KEY" "$KH"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$KEY"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$KH"
          ssh -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KH" \
            "$DEPLOY_USER@$DEPLOY_HOST" "$SHA"
