name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # About a fifth of the commits reaching main are documentation only —
  # release notes, ledgers, ROADMAP, CLAUDE.md — and none of them can break a
  # Playwright flow, yet each was paying e2e's ~8 minutes. This job answers
  # one question: does the diff touch anything outside docs/? The reasoning,
  # the allowlist and the fail-safes live in scripts/ci-changes.sh, which has
  # its own tests in the `scripts` job below.
  #
  # Note the polarity everywhere downstream: the code jobs test
  # `!= 'false'`, never `== 'true'`. Only a confident "everything here is
  # documentation" skips them; a crash, a missing output, or a failure of
  # this job runs them anyway. A wrongly-skipped e2e is a green suite that
  # should have been red, and that must not be reachable by accident.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the script diffs against a merge base
      - id: decide
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: echo "code=$(bash scripts/ci-changes.sh "$BASE" "$HEAD")" >> "$GITHUB_OUTPUT"

  root-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

  app:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      # Phase 7B Task 8: `pnpm build`'s own dist/client must never contain
      # this repo's dev-only monitor tooling (fake.ts's simulator, the
      # pm5-lab/pm5-bridge dev harness) — see scripts/dist-grep.sh's own
      # header for the full reasoning and why its needles are string
      # literals rather than identifiers a minifier could rename away.
      - run: pnpm dist:grep

  docker:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build api image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          target: api
          push: false
          build-args: |
            APP_VERSION=ci
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          target: web
          push: false

  e2e:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.17.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Install Playwright + Chromium (with OS deps)
        working-directory: app
        run: pnpm exec playwright install --with-deps chromium
      - name: Boot the compose stack (e2e override arms the test-signin backdoor)
        run: |
          POSTGRES_PASSWORD=devpass TEST_AUTH_SECRET=e2e-secret APP_VERSION=e2e \
            docker compose -f compose.yml -f compose.e2e.yml up -d --build --wait --wait-timeout 120
      - name: Run Playwright (flows + design)
        working-directory: app
        run: pnpm exec playwright test --project=chromium
      # `always()`, NOT `failure()` (flake hunt, 2026-08-21). With
      # `retries: 1`, a test that fails once and passes on retry leaves the
      # JOB green — so `failure()` was false and the report was never
      # uploaded. The trace WAS captured (`trace: "on-first-retry"`) and
      # then discarded. A hard failure kept its evidence; a FLAKE, the only
      # case that needs it, never did. That is why every sighting for
      # months resolved to "passed on re-run" with nothing to look at.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 14

  # Runs on EVERY push, documentation or not: it is six seconds, and one of
  # the scripts it tests is the one deciding whether the other jobs run.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint + test the pre-commit hook
        run: |
          bash -n .husky/pre-commit
          bash scripts/pre-commit.test.sh
      - name: Lint + test the deploy script
        run: |
          bash -n scripts/deploy.sh
          bash scripts/deploy.test.sh
      - name: Lint + test the CI path filter
        run: |
          bash -n scripts/ci-changes.sh
          bash scripts/ci-changes.test.sh
      - name: Lint + test the stack-env guard
        run: |
          bash -n app/scripts/stack-env.sh
          bash app/scripts/stack-env.test.sh
      - name: Test the Concept2 compose env passthrough
        run: |
          bash -n scripts/compose-env.test.sh
          bash scripts/compose-env.test.sh
      - name: Lint + test the ios-release probe-flag guard
        run: |
          bash -n app/scripts/ios-release.sh
          bash app/scripts/ios-release.test.sh

  deploy:
    needs: [changes, root-hooks, app, docker, e2e, scripts]
    # A documentation-only push skips app/docker/e2e, and GitHub skips a job
    # whose dependency skipped — so this cannot use a plain `needs` gate any
    # more. It deploys when nothing FAILED, which keeps prod's SHA equal to
    # main's tip even on documentation pushes (the app bundle is identical,
    # but /api/version reports the deployed commit and should not lag).
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: self-hosted
    environment: production
    permissions:
      contents: read
    timeout-minutes: 20
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          SHA: ${{ github.sha }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          umask 077
          KEY="$(mktemp)"; KH="$(mktemp)"
          trap 'rm -f "$KEY" "$KH"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$KEY"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$KH"
          ssh -i "$KEY" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$KH" \
            "$DEPLOY_USER@$DEPLOY_HOST" "$SHA"
