<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>tab bar fill probe</title>
<style>
  :root { --page:#f3f1e9; --card:#fff; --rule:#dcd8cc; --ink:#1b1a17; }
  * { box-sizing:border-box; }
  body { margin:0; padding:14px 0 0; background:var(--page); color:var(--ink);
         font:15px/1.4 -apple-system,BlinkMacSystemFont,sans-serif; }
  #out { position:fixed; bottom:44px; left:0; right:0; height:78px; z-index:99;
         background:#111; color:#7CFF6B; font:13px/1.3 ui-monospace,Menlo,monospace;
         padding:6px 10px; pointer-events:none; border-bottom:1px solid #444; }
  #out b { color:#fff; font-weight:600; }
  .hint { margin:0 12px 14px; font-weight:600; }
  input { font-size:16px; display:block; width:calc(100% - 24px); height:56px;
          margin:0 12px 14px; padding:10px 14px; border:2px solid #999; border-radius:12px;
          background:#fff; }
  .row { height:76px; margin:10px 12px; background:var(--card); border:1px solid var(--rule);
         border-radius:4px; padding:8px 12px; font-variant-numeric:tabular-nums; color:#6b6862; }
  .spacer { height:900px; }

  /* Three fixed 44px bars, one per third of the width. Each tries a DIFFERENT
     way to paint 140px of surface BELOW itself. Whichever colour survives in
     the strip is the mechanism that works. */
  .bar { position:fixed; height:44px; background:#111; z-index:20;
         color:#fff; font:600 13px/44px ui-monospace,Menlo,monospace; text-align:center; }

  /* A — the SHIPPED mechanism: ::after overflowing the bar's own box. */
  #a { bottom:0; left:0; width:33.33%; }
  #a::after { content:""; position:absolute; top:100%; left:0; right:0; height:140px;
              background:#E23D2E; }

  /* B — the band lives INSIDE the bar's own border box, which is pushed below
     the anchor so the visible 44px strip stays where it was. */
  #b { bottom:-140px; left:33.33%; width:33.34%; height:184px; background:#2E7D32; padding:0; }
  #b .tabs { height:44px; background:#111; line-height:44px; }

  /* C — a solid spread box-shadow cast below the bar. */
  #c { bottom:0; left:66.67%; width:33.33%; box-shadow:0 140px 0 #1B54B8; }
</style>
</head>
<body>
<div id="out">reading…</div>

<p class="hint">1. Tap the field. 2. Scroll the list. 3. Screenshot.</p>
<input id="q" type="search" placeholder="TAP HERE" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search">

<div class="row">row 01</div><div class="row">row 02</div><div class="row">row 03</div>
<div class="row">row 04</div><div class="row">row 05</div><div class="row">row 06</div>
<div class="row">row 07</div><div class="row">row 08</div><div class="row">row 09</div>
<div class="row">row 10</div><div class="row">row 11</div><div class="row">row 12</div>
<div class="row">row 13</div><div class="row">row 14</div><div class="row">row 15</div>
<div class="row">row 16</div><div class="row">row 17</div><div class="row">row 18</div>
<div class="spacer"></div>

<div class="bar" id="a">A ::after</div>
<div class="bar" id="b"><div class="tabs">B box</div></div>
<div class="bar" id="c">C shadow</div>

<script>
  var out = document.getElementById('out');
  function report() {
    var vv = window.visualViewport;
    var ra = document.getElementById('a').getBoundingClientRect();
    out.innerHTML =
      '<b>inner</b> ' + window.innerHeight +
      '  <b>vv.h</b> ' + (vv ? Math.round(vv.height) : '-') +
      '  <b>vv.top</b> ' + (vv ? Math.round(vv.offsetTop) : '-') +
      '  <b>scale</b> ' + (vv ? vv.scale.toFixed(2) : '-') +
      '<br><b>scrollY</b> ' + Math.round(window.scrollY) +
      '  <b>barTop</b> ' + Math.round(ra.top) +
      '  <b>barBottom</b> ' + Math.round(ra.bottom) +
      '<br><b>focus</b> ' + ((document.activeElement && document.activeElement.id) || 'none') +
      '  <b>dpr</b> ' + window.devicePixelRatio;
  }
  report();
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', report);
    visualViewport.addEventListener('scroll', report);
  }
  window.addEventListener('scroll', report);
  setInterval(report, 250);
</script>
</body>
</html>
