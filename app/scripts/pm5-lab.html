<!doctype html>
<html lang="en">
  <head>

        margin: 0 0.5rem 0.5rem 0;
        padding: 0.5rem 1rem;
      }
      #log {
        white-space: pre-wrap;
        border: 1px solid #888;
        padding: 0.5rem;
        height: 60vh;
        overflow-y: auto;
      }
    </style>

    <h1>PM5 lab</h1>

      Dev-only harness for
      <code>docs/monitor/pm5-interface-notes.md</code> §17's laptop-session

    </p>
    <p>
      <button id="connect">Scan &amp; connect</button>
      <button id="program">Program test workout</button>
      <button id="terminate">Terminate</button>

    <div id="log"></div>
    <script type="module" src="/scripts/pm5-lab.ts"></script>
