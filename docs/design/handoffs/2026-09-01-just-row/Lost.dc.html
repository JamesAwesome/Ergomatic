<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
  <style>
    :root {
      --page: #f4f1e8; --surface: #fffdf7; --ink: #1b1a17; --ink-2: #3f3c35; --ink-3: #57544c; --ink-5: #a09a8c;
      --rule: #d8d3c4; --rule-2: #ded8c9; --accent: #b5341f; --judge-slower: #962718;
      --radius: 2px; --tap: 44px;
      --c-size-target: 36px; --c-size-band: 28px; --c-size-status: 21px;
      --c-size-label: 14px; --c-size-control: 13px;
      --font-sans: "Archivo", system-ui, sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    body { margin: 0; font-family: var(--font-sans); background: var(--page); color: var(--ink); }
    a { color: var(--accent); } a:hover { color: #9c2c19; }
    .screen { width: 390px; height: 844px; background: var(--page); box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; }
    /* Shipped chrome, verbatim: solid --judge-slower, --surface text, 12px
       padding, 10px bottom margin. 7.94:1. */
    .lost { display: flex; flex-direction: column; gap: 5px; flex: none; background: var(--judge-slower); padding: 12px; margin-bottom: 10px; }
    .lost-title { font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.14em; color: var(--surface); }
    .lost-body { font-family: var(--font-sans); font-size: 13px; line-height: 1.4; color: var(--surface); }
    .head { display: flex; align-items: center; gap: 12px; }
    .line { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .mark { width: 8px; height: 8px; background: var(--ink-5); flex: none; }
    .device { font-family: var(--font-mono); font-size: var(--c-size-control); letter-spacing: 0.1em; color: var(--ink-2); }
    .status { font-family: var(--font-mono); font-size: var(--c-size-status); letter-spacing: 0.1em; color: var(--ink); margin: 20px 0 0; }
    .progress-row { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
    .track { flex: 1; display: flex; height: 6px; background: var(--rule-2); }
    .seg { flex: 1; height: 100%; background: var(--ink-3); }
    /* Everything stale greys to --ink-3 TOGETHER, metres included: the one
       number still painted at full ink would be the one nobody can vouch
       for. Shipped rule, inherited. */
    .meters { flex: none; font-family: var(--font-mono); font-size: 22px; letter-spacing: 0.02em; color: var(--ink-3); white-space: nowrap; }
    .stack { flex: 1; display: flex; flex-direction: column; justify-content: space-between; margin-top: 22px; }
    .hero { display: flex; flex-direction: column; min-width: 0; border-top: 2px solid var(--ink); padding-top: 16px; }
    .hero-rate { border-top: 1px solid var(--rule); }
    /* The banner's own step-down, shipped values: 100 -> 76 split,
       84 -> 64 rate, tenths 52 -> 40. */
    .hero-value { font-family: var(--font-mono); font-size: 76px; line-height: 0.95; color: var(--ink-3); letter-spacing: -0.02em; }
    .tenths { font-size: 40px; }
    .rate-value { font-family: var(--font-mono); font-size: 64px; line-height: 0.95; color: var(--ink-3); }
    .target-row { display: flex; align-items: baseline; gap: 10px; margin-top: 8px; }
    .target-value { font-family: var(--font-mono); font-size: var(--c-size-target); color: var(--ink-3); }
    .avg-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; color: var(--ink-3); }
    .avg-value { font-family: var(--font-mono); font-size: var(--c-size-target); color: var(--ink-3); }
    .rate-unit { font-family: var(--font-mono); font-size: var(--c-size-label); letter-spacing: 0.1em; color: var(--ink-3); }
    .band { display: flex; flex-direction: column; gap: 2px; }
    .band-label { font-family: var(--font-mono); font-size: var(--c-size-label); letter-spacing: 0.1em; color: var(--ink-3); }
    .band-value { font-family: var(--font-mono); font-size: var(--c-size-band); color: var(--ink-3); }
    .actions { flex-shrink: 0; margin-top: 14px; }
    .l1 { display: flex; align-items: center; justify-content: center; min-height: 56px; background: var(--accent); border: none; border-radius: var(--radius); color: #fffdf7; font-family: var(--font-sans); font-size: 16px; font-weight: 600; }
  </style>
</helmet>

<div class="screen">
  <!-- The shipped banner counts INTERVALS kept. A free row has none, so it
       counts what it does have. The promise underneath is the one the
       existing copy already makes: a row the app lost is never confused
       with a row you chose to end. -->
  <div class="lost">
    <span class="lost-title">LOST THE MONITOR</span>
    <span class="lost-body">6:33 &middot; 1,396 m kept.</span>
  </div>

  <div class="head">
    <div class="line">
      <span class="mark"></span>
      <span class="device">PM5 432331249</span>
    </div>
  </div>

  <p class="status">JUST ROW</p>

  <div class="progress-row">
    <div class="track"><span class="seg"></span></div>
    <span class="meters">1,396m</span>
  </div>

  <div class="stack">
    <div class="hero">
      <span class="hero-value">2:14<span class="tenths">.0</span></span>
      <div class="target-row">
        <span class="target-value">Free</span>
        <span class="avg-label">AVG</span>
        <span class="avg-value">2:20.8</span>
      </div>
    </div>
    <div class="hero hero-rate">
      <span class="rate-value">22</span>
      <div class="target-row">
        <span class="target-value">Free</span>
        <span class="rate-unit">SPM</span>
      </div>
    </div>
    <div class="band">
      <span class="band-label">ELAPSED</span>
      <span class="band-value">6:33</span>
    </div>
  </div>

  <!-- ONE action, not a Log/Discard pair: discard already exists at the log
       door this button opens, and two mechanisms for one decision is how
       the better-informed offer loses silently. No Reconnect either, and
       that is a hardware fact rather than a simplification: the monitor
       stops advertising while a Just Row is open, so the app cannot get
       back in until the rower ends the row on the erg. -->
  <div class="actions">
    <div class="l1">Log</div>
  </div>
</div>
</x-dc>
</body>
</html>
